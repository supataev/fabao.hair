<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fabao — оригинальный уход против выпадения волос · Бишкек</title>
  <meta name="description" content="Официальный дистрибьютор ZhangGuang 101, DekoHair и Follicell в Кыргызстане. Тоник 101B, шампуни, пептидный уход. Доставка по Бишкеку и регионам.">
  <meta name="theme-color" content="#0F4A37">
  <meta property="og:title" content="Fabao — уход против выпадения волос">
  <meta property="og:description" content="Официальный дистрибьютор ZhangGuang 101, DekoHair и Follicell в Кыргызстане.">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <header class="header">
    <div class="wrap header-inner">
      <a class="logo" href="#top" aria-label="Fabao"><span class="wordmark"></span></a>
      <nav class="nav" aria-label="Main">
        <a href="#catalog" data-i18n="nav_catalog"></a>
        <a href="#brands" data-i18n="nav_brands"></a>
        <a href="#order" data-i18n="nav_delivery"></a>
        <a href="#wholesale" data-i18n="nav_wholesale"></a>
        <a href="#contacts" data-i18n="nav_contacts"></a>
      </nav>
      <div class="header-actions">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="ru">RU</button>
          <button type="button" data-lang="ky">KG</button>
        </div>
        <a class="btn btn-small btn-emerald js-wa-consult" target="_blank" rel="noopener">WhatsApp</a>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="wrap hero-grid">
        <div class="hero-copy">
          <p class="eyebrow" data-i18n="eyebrow_official"></p>
          <h1 data-setting="hero_title"></h1>
          <p class="lead" data-setting="hero_subtitle"></p>
          <div class="hero-cta">
            <a class="btn btn-emerald" href="#catalog" data-i18n="cta_catalog"></a>
            <a class="btn btn-line js-wa-consult" target="_blank" rel="noopener" data-i18n="cta_consult"></a>
          </div>
        </div>
        <div class="hero-panel" aria-hidden="true">
          <span class="wordmark wordmark-hero"></span>
          <ul class="hero-brands js-hero-brands"></ul>
        </div>
      </div>
    </section>

    <section class="section" id="brands">
      <div class="wrap">
        <div class="section-head">
          <h2 data-i18n="brands_title"></h2>
          <p data-i18n="brands_lead"></p>
        </div>
        <div class="brand-grid js-brands"></div>
      </div>
    </section>

    <section class="section section-tint" id="catalog">
      <div class="wrap">
        <div class="section-head">
          <h2 data-i18n="catalog_title"></h2>
          <p data-i18n="catalog_lead"></p>
        </div>
        <div class="filters js-filters" role="tablist"></div>
        <div class="product-grid js-products"></div>
      </div>
    </section>

    <section class="section" id="order">
      <div class="wrap">
        <div class="section-head"><h2 data-i18n="order_title"></h2></div>
        <ol class="steps">
          <li><span class="step-n">1</span><h3 data-i18n="step1_t"></h3><p data-i18n="step1_d"></p></li>
          <li><span class="step-n">2</span><h3 data-i18n="step2_t"></h3><p data-i18n="step2_d"></p></li>
          <li><span class="step-n">3</span><h3 data-i18n="step3_t"></h3><p data-i18n="step3_d"></p></li>
        </ol>
        <div class="delivery">
          <h3 data-i18n="delivery_title"></h3>
          <p data-setting="delivery_text"></p>
        </div>
      </div>
    </section>

    <section class="section wholesale" id="wholesale">
      <div class="wrap wholesale-grid">
        <div>
          <p class="eyebrow eyebrow-gold" data-i18n="wholesale_eyebrow"></p>
          <h2 data-i18n="wholesale_title"></h2>
          <p class="lead" data-setting="wholesale_text"></p>
          <a class="btn btn-gold js-wa-wholesale" target="_blank" rel="noopener" data-i18n="wholesale_cta"></a>
        </div>
        <ul class="wholesale-points js-wholesale-points"></ul>
      </div>
    </section>

    <section class="section" id="contacts">
      <div class="wrap about-grid">
        <div>
          <h2 data-i18n="about_title"></h2>
          <p class="lead" data-setting="about_text"></p>
        </div>
        <div class="contact-card">
          <h3 data-i18n="contacts_title"></h3>
          <dl>
            <div class="js-row-address"><dt data-i18n="address"></dt><dd data-setting="address"></dd></div>
            <div class="js-row-hours"><dt data-i18n="hours"></dt><dd data-setting="hours"></dd></div>
            <div><dt>WhatsApp</dt><dd><a class="js-wa-consult js-wa-number" target="_blank" rel="noopener"></a></dd></div>
            <div><dt>Instagram</dt><dd><a class="js-ig" target="_blank" rel="noopener"></a></dd></div>
          </dl>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span class="wordmark wordmark-footer"></span>
      <p data-i18n="footer_rights"></p>
      <p class="muted">© <span class="js-year"></span> Fabao</p>
    </div>
  </footer>

  <dialog class="modal js-modal">
    <div class="modal-body js-modal-body"></div>
  </dialog>

  <script type="module" src="assets/js/site.js"></script>
</body>
</html>
